# H-AUTO-001: validar PR automaticamente; publicar apenas por workflow_dispatch autorizado.
name: Validate PartiuFloripa / controlled Pages deploy
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && 'pages-release' || format('pages-pr-{0}', github.event.pull_request.number) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-site.cjs
      - run: node scripts/validate-events.cjs
      - run: node scripts/test-audience-heat.cjs
      - run: node scripts/test-event-ux.cjs
      - run: node scripts/test-venue-location.cjs
      - run: node scripts/test-venue-hours.cjs
      - run: node scripts/test-home-layout.cjs
      - run: node scripts/test-ui-baseline.cjs
      - run: node scripts/test-visual-assets.cjs
      - run: npm install --no-save --no-audit --no-fund playwright@1.56.1
      - run: node scripts/test-ui-browser.cjs
      - run: node scripts/test-product-regressions.cjs
      - run: node scripts/test-image-rights.cjs
      - run: node scripts/test-licensed-photos.cjs
      - run: node scripts/test-media-selection.cjs
      - run: node scripts/test-map-popup.cjs
  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - run: node scripts/generate-event-pages.cjs
      - run: node scripts/test-generated-details.cjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify actual published UI and data contract
        run: node scripts/verify-deployed-site.cjs
        env:
          PARTIU_SITE_URL: ${{ steps.deployment.outputs.page_url }}


