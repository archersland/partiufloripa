name: Deploy PartiuFloripa
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-site.cjs
      - run: node --check scripts/detail-dialog.js
      - run: node scripts/validate-events.cjs
      - run: node scripts/test-audience-heat.cjs
      - run: node scripts/test-event-ux.cjs
      - run: node scripts/test-venue-location.cjs
      - run: node scripts/test-venue-hours.cjs
      - run: node scripts/test-home-layout.cjs
      - run: node scripts/test-ui-baseline.cjs
      - run: node scripts/test-browser-ui.cjs
      - run: node scripts/test-product-regressions.cjs
      - run: node scripts/test-image-rights.cjs
      - run: node scripts/test-licensed-photos.cjs
      - run: node scripts/test-media-selection.cjs
      - run: node scripts/test-map-popup.cjs
  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - run: node scripts/generate-event-pages.cjs
      - run: node scripts/test-generated-details.cjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify actual published UI and data contract
        run: node scripts/verify-deployed-site.cjs
        env:
          PARTIU_SITE_URL: ${{ steps.deployment.outputs.page_url }}


